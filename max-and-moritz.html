<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read-Along: Max and Moritz</title>
<style>
:root{--paper:#fff6e3;--ink:#4a2e1a;--lit:#ff9a1f;--glow:#ffd36b}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 30% 20%,#fbe3b8,#e8b97a);font-family:Georgia,"Palatino Linotype",serif;color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.6rem 1rem}
h1{font-size:clamp(1.1rem,2.6vw,1.8rem);margin:0}
.book{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:1rem;padding:0 1rem 1rem;min-height:0}
@media (orientation:portrait),(max-width:760px){.book{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.panel{background:var(--paper);border-radius:22px;box-shadow:0 8px 24px #0003,inset 0 0 0 6px #f3dcae;padding:1rem;position:relative;overflow:hidden}
#scene svg{width:100%;height:100%;max-height:60vh;display:block}
#text{font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.6;display:flex;flex-direction:column}
#words{flex:1}
.w{display:inline-block;padding:0 .12em;margin:0 .05em;border-radius:.3em;cursor:pointer;transition:all .25s}
.w.lit{color:#b34d00;background:var(--glow);box-shadow:0 0 14px var(--glow);transform:scale(1.04)}
.w.next{border-bottom:3px dashed var(--lit)}
.ctrl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.6rem}
button{font:inherit;font-size:1.05rem;border:0;border-radius:999px;padding:.6rem 1.1rem;background:#8a5a2b;color:#fff;cursor:pointer;box-shadow:0 3px 0 #5b3a1a}
button:active{transform:translateY(2px);box-shadow:none}
#start{font-size:1.3rem;padding:.8rem 1.6rem;background:#2e8b57;box-shadow:0 3px 0 #1d5c39}
#start.on{background:#c0392b;box-shadow:0 3px 0 #7b2318}
#mic{display:inline-flex;align-items:center;gap:.4rem;font-size:1rem}
#dot{width:14px;height:14px;border-radius:50%;background:#999}
#dot.on{background:#e74c3c;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #e74c3c33}}
#msg{font-size:1rem;background:#fff1c9;border-radius:12px;padding:.5rem .8rem;margin:.4rem 1rem 0;display:none}
#pg{font-size:1rem;opacity:.7}
#heard{font-size:.9rem;opacity:.6;font-style:italic;min-height:1.2em}
/* animations */
#scene svg [class]{transform-box:fill-box}
.bob{transform-origin:center bottom;animation:bob .9s ease-in-out infinite}@keyframes bob{0%,100%{transform:scale(1.04,.96)}50%{transform:translateY(-6px) scale(.97,1.04)}}
.walk{animation:walk 3s ease-out}@keyframes walk{from{transform:translateX(-80px)}}
.blink{transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.drift{animation:drift 40s linear infinite alternate}@keyframes drift{to{transform:translateX(60px)}}
.spin{transform-origin:center;animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-origin:center bottom;animation:sway 3s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.hammer{transform-origin:left center;animation:ham .35s ease-in-out infinite alternate}@keyframes ham{to{transform:rotate(-50deg)}}
.build{transform-origin:center bottom;animation:grow 1.2s cubic-bezier(.3,1.6,.6,1) both}@keyframes grow{from{transform:scale(1,0)}}
.sneak{transform-origin:center bottom;animation:sneak 1.4s ease-in-out infinite}@keyframes sneak{50%{transform:translate(8px,-3px) scale(1.02,.98)}}
.armwave{transform-origin:right top;animation:knockA .5s ease-in-out infinite alternate}@keyframes knockA{to{transform:rotate(14deg)}}
.knock{animation:pop .5s ease-in-out infinite alternate}
.wag{transform-origin:left bottom;animation:wag .6s ease-in-out infinite alternate}@keyframes wag{to{transform:rotate(-12deg)}}
.huff{transform-origin:center bottom;animation:huff 1.6s ease-in-out infinite}@keyframes huff{0%,100%{transform:scale(1)}40%{transform:scale(.94,1.08) translateX(6px)}60%{transform:scale(1.08,.94) translateX(-4px)}}
.strain{transform-origin:center bottom;animation:huff .7s ease-in-out infinite}
.cheeks{transform-origin:center;animation:cheek 1.6s ease-in-out infinite}@keyframes cheek{0%,100%{transform:scale(.6)}40%{transform:scale(1.4)}}
.wind{stroke-dasharray:40 26;animation:wind .5s linear infinite}.wind2{stroke-dasharray:20 30;animation:wind .35s linear infinite}@keyframes wind{to{stroke-dashoffset:-66}}
.mpuff{transform-origin:center;animation:mpuff .8s ease-out infinite}@keyframes mpuff{from{transform:scale(.4);opacity:1}to{transform:translateX(60px) scale(1.6);opacity:0}}
.fly{animation:fly 1.6s linear infinite}@keyframes fly{from{transform:translate(-60px,0) rotate(0);opacity:0}20%{opacity:1}to{transform:translate(220px,-60px) rotate(720deg);opacity:0}}
.blow{transform-origin:center bottom;animation:blow 2.2s cubic-bezier(.6,-.3,.9,.6) .2s forwards}@keyframes blow{20%{transform:skewX(-12deg)}to{transform:translate(320px,-160px) rotate(80deg) scale(.4);opacity:0}}
.runoff{animation:runoff 3s ease-in .4s forwards}@keyframes runoff{to{transform:translateX(160px)}}
.run{transform-origin:center bottom;animation:run .3s ease-in-out infinite alternate}@keyframes run{to{transform:translateY(-6px) rotate(8deg)}}
.legs{animation:legs .15s linear infinite alternate}@keyframes legs{to{transform:skewX(25deg)}}
.dust{transform-origin:center;animation:dust .8s ease-out infinite}@keyframes dust{from{transform:scale(.3);opacity:1}to{transform:translateX(18px) scale(1.4);opacity:0}}
.pop{transform-origin:center;animation:pop 1s ease-in-out infinite alternate}@keyframes pop{from{transform:scale(.94)}to{transform:scale(1.06)}}
.sweat{animation:sweat 1s ease-in infinite}@keyframes sweat{to{transform:translate(-6px,20px);opacity:0}}
.drop{animation:drop 2.2s cubic-bezier(.5,0,1,.6) infinite}@keyframes drop{0%{transform:translateY(-80px)}70%{transform:translateY(150px) scale(1,1)}80%{transform:translateY(160px) scale(1.2,.7)}100%{transform:translateY(160px) scale(1.2,.7);opacity:0}}
.splash{transform-origin:center bottom;animation:splash 2.2s ease-out infinite}@keyframes splash{0%,68%{transform:scale(0)}78%{transform:scale(1.3)}100%{transform:scale(1);opacity:0}}
.steam{animation:steam 2s ease-out infinite}@keyframes steam{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-50px) scale(1.5)}}
.flame{transform-origin:center bottom;animation:flame .25s ease-in-out infinite alternate}@keyframes flame{to{transform:scaleY(1.2)}}
.dance{transform-origin:center bottom;animation:dance .5s ease-in-out infinite alternate}@keyframes dance{from{transform:rotate(-10deg) scale(1.05,.95)}to{transform:rotate(10deg) translateY(-12px) scale(.95,1.06)}}
.dance2{transform-origin:center bottom;animation:dance .5s ease-in-out .25s infinite alternate-reverse}
.confetti{animation:conf 2.5s linear infinite}@keyframes conf{to{transform:translateY(320px) rotate(540deg)}}
.flee{animation:flee 3.5s ease-in forwards}@keyframes flee{to{transform:translateX(-300px)}}
.fade{animation:fadein .6s}@keyframes fadein{from{opacity:0}}
.peck{transform-origin:center bottom;animation:peck 1s ease-in-out infinite}@keyframes peck{50%{transform:rotate(14deg) scale(1.04,.96)}}
.flap{transform-origin:center;animation:flap .3s ease-in-out infinite alternate}@keyframes flap{to{transform:scale(1.15,.9) rotate(6deg)}}
.flap2{animation:flap .25s ease-in-out infinite alternate}
.waddle{transform-origin:center bottom;animation:waddle .6s ease-in-out infinite alternate}@keyframes waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.stomp{transform-origin:center bottom;animation:stomp .4s ease-in-out infinite alternate}@keyframes stomp{to{transform:scale(1.06,.94)}}
.fall{transform-origin:center bottom;animation:fall .6s ease-in-out infinite alternate}@keyframes fall{from{transform:rotate(-12deg)}to{transform:rotate(12deg) translateY(6px)}}
.shake{animation:shake .15s linear infinite alternate}@keyframes shake{to{transform:translateX(3px)}}
.burst{transform-origin:center;animation:burst .6s ease-out infinite}@keyframes burst{from{transform:scale(.3)}to{transform:scale(1.2);opacity:.6}}
.crawl{animation:crawl .3s linear infinite alternate}@keyframes crawl{to{transform:translate(2px,-1px)}}
.swat{transform-origin:left bottom;animation:swat .35s ease-in infinite alternate}@keyframes swat{to{transform:rotate(40deg)}}
.saw{animation:saw .25s linear infinite alternate}@keyframes saw{to{transform:translateX(-8px)}}
.trickle{animation:trickle 1s ease-in infinite}@keyframes trickle{to{transform:translateY(22px);opacity:0}}
.wiggle{transform-origin:center bottom;animation:wiggle .3s ease-in-out infinite alternate}@keyframes wiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.drop2{animation:drop2 1.2s ease-in-out infinite alternate}@keyframes drop2{to{transform:translateY(-10px)}}
.runoff2{animation:runoff2 3s ease-in forwards}@keyframes runoff2{to{transform:translateX(-140px)}}
.relief{animation:dance .6s ease-in-out infinite alternate}
</style></head><body>
<header><h1>📖 Max and Moritz</h1>
<div class="ctrl" style="margin:0"><button id="start">🎤 Start Listening</button><span id="mic"><span id="dot"></span><span id="micTxt">Mic off</span></span></div></header>
<div id="msg"></div>
<main class="book">
 <section class="panel" id="scene"></section>
 <section class="panel" id="text"><div id="words"></div><div id="heard"></div>
  <div class="ctrl"><button id="back">◀ Back</button><button id="next">Next ▶</button><button id="restart">↺ Restart</button><span id="pg"></span></div>
 </section>
</main>
<script>
"use strict";
const PAGES=[
"This is Max, and this is Moritz. They lived in a little village, and they loved to play mean tricks on everyone. Oh, those naughty boys!",
"Widow Bolte had three hens and a proud rooster. The boys tied bread to strings. The hens gobbled the bread, got tangled, and flapped up into a tree.",
"Tailor Böck lived across a little brook. The boys sawed a gap in his bridge and teased him. He ran out, the board cracked, and splash! Into the water!",
"Master Lampel, the teacher, loved his pipe. While he was at church, the boys filled it with gunpowder. He lit the pipe, and boom! His face turned black as soot.",
"Uncle Fritz went to bed. The boys hid May bugs under his blanket. The bugs crawled out, all over his nose! Uncle Fritz jumped up and squashed them, one by one.",
"Next they sneaked into the bakery to steal sweets. Plop! They fell into the dough. The baker rolled them up and baked them in the oven. But they nibbled their way out!",
"Then the boys cut holes in Farmer Mecke's grain sacks. The grain trickled out. But the farmer caught them! He stuffed Max and Moritz into a sack.",
"He carried the sack to the mill. Crunch, crunch, went the millstones. Max and Moritz were ground into tiny bits, and the miller's ducks gobbled them up.",
"When the village heard the news, nobody was sad. Everyone said, thank goodness, no more mean tricks! The end."
];
// ---------- SVG scenes (cartoon) ----------
const O='stroke="#2b1a10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const O2='stroke="#2b1a10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
const DEFS=`<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ec8ff"/><stop offset=".7" stop-color="#bfeaff"/><stop offset="1" stop-color="#fff6d6"/></linearGradient>
<linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be36b"/><stop offset="1" stop-color="#5cb33c"/></linearGradient>
<linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd05a"/><stop offset="1" stop-color="#3f9a2c"/></linearGradient>
<radialGradient id="sunG"><stop offset="0" stop-color="#fff7a8"/><stop offset="1" stop-color="#ffc21a"/></radialGradient>
<linearGradient id="kitchen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#f3b871"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb8ff"/><stop offset="1" stop-color="#2a78d0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff3a0"/><stop offset=".6" stop-color="#ff9a1f"/><stop offset="1" stop-color="#c0392b"/></radialGradient>
</defs>`;
const cloud=(x,y,s,d)=>`<g class="drift" style="animation-duration:${d}s"><g transform="translate(${x} ${y}) scale(${s})"><path d="M0 20 q-2 -18 18 -16 q8 -16 28 -6 q18 -8 24 10 q14 2 10 14 z" fill="#fff" ${O}/><path d="M6 22 q30 6 72 -2" fill="none" stroke="#d6ecff" stroke-width="4"/></g></g>`;
const tree=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-6" y="-10" width="12" height="34" fill="#8b5a2b" ${O}/><g class="sway"><circle cx="0" cy="-30" r="24" fill="#3fa34d" ${O}/><circle cx="-16" cy="-16" r="16" fill="#3fa34d" ${O}/><circle cx="16" cy="-16" r="16" fill="#3fa34d" ${O}/><circle cx="-6" cy="-38" r="8" fill="#6fd17a"/></g></g>`;
const flower=(x,y,c)=>`<g transform="translate(${x} ${y})"><path d="M0 0v-12" stroke="#2f7d1f" stroke-width="2"/><circle cy="-14" r="4" fill="${c}" stroke="#2b1a10" stroke-width="1.5"/><circle cy="-14" r="1.5" fill="#ffd84d"/></g>`;
// half-timbered house, origin bottom-center
function house(x,y,w=70,h=56,wall="#fbefd5",roof="#c0503a",s=1){const hw=w/2,B='stroke="#5a3418" stroke-width="4" stroke-linecap="round"';
 return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="${-hw}" y="${-h}" width="${w}" height="${h}" fill="${wall}" ${O}/>
 <path d="M${-hw} ${-h/2} h${w} M${-hw+4} ${-h} v${h} M${hw-4} ${-h} v${h} M0 ${-h} v${h/2} M${-hw+4} ${-h} l${hw-4} ${h/2} M${hw-4} ${-h} l${-hw+4} ${h/2} M${-hw+4} ${-h/2} l${hw*.45} ${h/2}" ${B} fill="none"/>
 <path d="M${-hw-8} ${-h+2} L0 ${-h-w*.62} L${hw+8} ${-h+2}z" fill="${roof}" ${O}/><path d="M${-hw*.4} ${-h-w*.2} h${hw*.8}" stroke="#8e3426" stroke-width="2"/>
 <rect x="${hw*.25}" y="${-h*.42}" width="${hw*.45}" height="${h*.3}" fill="#bfeaff" ${O2}/><path d="M${hw*.475} ${-h*.42} v${h*.3}" stroke="#2b1a10" stroke-width="1.5"/>
 <path d="M${-hw*.55} 0 v${-h*.38} h${hw*.4} v${h*.38}z" fill="#8b5a2b" ${O2}/><rect x="-6" y="${-h-w*.32}" width="12" height="10" fill="#ffe7a0" ${O2}/></g>`}
function church(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-14" y="-92" width="28" height="92" fill="#f2e6cf" ${O}/><path d="M-18 -90 L0 -150 L18 -90z" fill="#3f7d6b" ${O}/><path d="M0 -150 v-14 M-6 -158 h12" stroke="#2b1a10" stroke-width="3"/><circle cy="-72" r="8" fill="#fff" ${O2}/><path d="M0 -72 v-5 M0 -72 h4" stroke="#2b1a10" stroke-width="1.5"/><path d="M-6 -40 v-14 q6 -8 12 0 v14z" fill="#5a3418" ${O2}/><rect x="14" y="-50" width="44" height="50" fill="#f2e6cf" ${O}/><path d="M10 -48 L36 -72 L62 -48z" fill="#3f7d6b" ${O}/><path d="M30 0 v-16 q6 -8 12 0 v16z" fill="#5a3418" ${O2}/></g>`}
function bg(o={}){return DEFS+`<rect width="400" height="300" fill="url(#sky)"/>
<g transform="translate(345 46)"><g class="spin">${[0,45,90,135,180,225,270,315].map(a=>`<path transform="rotate(${a})" d="M0 -32 l5 -10 -10 0z" fill="#ffd23a"/>`).join("")}</g><circle r="22" fill="url(#sunG)" ${O}/><circle cx="-7" cy="-4" r="2.3" fill="#2b1a10"/><circle cx="7" cy="-4" r="2.3" fill="#2b1a10"/><path d="M-8 6 q8 7 16 0" fill="none" stroke="#2b1a10" stroke-width="2.5"/></g>
${cloud(20,26,.8,40)}${cloud(180,40,.6,55)}
<path d="M-10 200 q90 -50 190 -10 t230 -20 v130 h-420z" fill="url(#hill1)" ${O}/>
${o.village!==false?church(o.churchX||250,196,.8)+house(60,198,60,44,"#fbefd5","#c0503a",.9)+house(140,194,54,40,"#fff3c4","#a8452f",.85)+house(340,196,58,42,"#fbefd5","#b5523b",.9):""}
<path d="M-10 236 q120 -26 220 0 t200 -10 v80 h-420z" fill="url(#hill2)" ${O}/>
${o.flowers!==false?flower(24,268,"#ff6b9d")+flower(46,280,"#fff")+flower(376,272,"#b48cff"):""}`}
const eye=(x,y,look=0,brow=0)=>`<g transform="translate(${x} ${y})"><ellipse rx="5.5" ry="7" fill="#fff" stroke="#2b1a10" stroke-width="2"/><g class="blink"><circle cx="${1.2+look}" cy="1" r="3.2" fill="#2b1a10"/><circle cx="${2.4+look}" cy="-.8" r="1.2" fill="#fff"/></g><path d="M-6 ${-10-brow} q6 ${-3+brow*2} 12 ${brow*1.5}" fill="none" stroke="#2b1a10" stroke-width="2.2"/></g>`;
const MOUTH={happy:'<path d="M-6 0 q6 8 13 0 q-6 4 -13 0z" fill="#c0392b" stroke="#2b1a10" stroke-width="2"/>',
 scared:'<ellipse cx="0" cy="2" rx="4" ry="5.5" fill="#7a1f1f" stroke="#2b1a10" stroke-width="2"/>',
 smile:'<path d="M-6 0 q6 6 12 0" fill="none" stroke="#2b1a10" stroke-width="2.5"/>',
 grin:'<path d="M-8 -1 q8 12 16 0z" fill="#c0392b" stroke="#2b1a10" stroke-width="2"/><path d="M-6 0 h12" stroke="#fff" stroke-width="2"/>',
 sly:'<path d="M-6 2 q8 4 13 -4" fill="none" stroke="#2b1a10" stroke-width="2.5"/>',
 angry:'<path d="M-6 4 q6 -6 12 0" fill="none" stroke="#2b1a10" stroke-width="2.5"/>'};
const SKIN="#ffd9b3",SKINS="#f0b88e";
// Boy: origin at feet, faces RIGHT; flip=true faces LEFT
function boy(x,y,s,who,expr="grin",anim="bob",flip=false,item="",arm="out"){const M=who==="max",jc=M?"#2f6fd6":"#3fa34d",js=M?"#1d4ea0":"#257a33";
 const ah={out:[22,-42],up:[18,-66],down:[12,-24]}[arm],ap={out:"M4 -46 q12 0 18 4",up:"M4 -46 q10 -8 14 -20",down:"M4 -46 q8 10 8 22"}[arm];
 const hair=M?`<path d="M-19 6 Q-23 -23 1 -22 Q22 -21 20 -6 L4 -8 Q-6 -6 -9 6z" fill="#3a2414" ${O}/><path d="M-12 -14 q8 -6 18 -4" stroke="#6b4a2e" stroke-width="2.5" fill="none"/>`
  :`<path d="M-1 -18 q-5 -15 8 -19 q11 -2 8 8 q-3 6 -9 2" fill="none" stroke="#2b1a10" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="-6" cy="-11" rx="6" ry="3" fill="#fff" opacity=".6" transform="rotate(-25 -6 -11)"/>`;
 return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><g class="${anim}">
 <g class="${/run/.test(anim)?'legs':''}"><rect x="-10" y="-26" width="8" height="22" fill="#5a4632" ${O}/><rect x="2" y="-26" width="8" height="22" fill="#5a4632" ${O}/><path d="M-11 -3 h11 M1 -3 h12" stroke="#2b1a10" stroke-width="6" stroke-linecap="round"/></g>
 <path d="M-4 -46 q-10 6 -12 18" fill="none" stroke="#2b1a10" stroke-width="10" stroke-linecap="round"/><path d="M-4 -46 q-10 6 -12 18" fill="none" stroke="${js}" stroke-width="5.5" stroke-linecap="round"/>
 <path d="M-13 -50 q13 -6 26 0 l3 26 q-16 6 -32 0z" fill="${jc}" ${O}/><path d="M4 -51 l3 27 q6 0 9 -1 l-3 -24z" fill="${js}" opacity=".55"/><circle cx="6" cy="-40" r="1.6" fill="#ffd84d"/><circle cx="6" cy="-32" r="1.6" fill="#ffd84d"/>
 ${M?`<path d="M-9 -53 l20 0 l-8 13z" fill="#ff8c1a" ${O2}/><path d="M-2 -50 l-5 9" stroke="#ff8c1a" stroke-width="4" stroke-linecap="round"/>`:`<path d="M-8 -52 h17" stroke="#fff" stroke-width="4"/>`}
 <g transform="translate(0 -69)"><circle r="19" fill="${SKIN}" ${O}/><path d="M-17 6 q12 14 30 8 q-14 10 -28 2z" fill="${SKINS}"/><ellipse cx="-9" cy="2" rx="4" ry="5" fill="${SKIN}" ${O2}/>${hair}
 ${eye(3,-3,1.2,expr==="scared"?3:0)}${eye(13,-3,1.2,expr==="scared"?3:0)}<ellipse cx="20" cy="3" rx="4" ry="3.5" fill="#f5b38a" ${O2}/><circle cx="12" cy="8" r="3" fill="#ff8a8a" opacity=".5"/><g transform="translate(10 11) scale(.8)">${MOUTH[expr]}</g></g>
 <path d="${ap}" fill="none" stroke="#2b1a10" stroke-width="10" stroke-linecap="round"/><path d="${ap}" fill="none" stroke="${jc}" stroke-width="5.5" stroke-linecap="round"/><circle cx="${ah[0]}" cy="${ah[1]}" r="4.5" fill="${SKIN}" ${O2}/>
 ${item?`<g transform="translate(${ah[0]} ${ah[1]})">${item}</g>`:""}
 </g></g>`}
// Adult: origin at feet, faces RIGHT
function adult(x,y,s,o={},flip=false,anim="bob"){const c=o.coat||"#8e5a9e",cs=o.coatS||"#6b3f7a",sk=o.skin||SKIN,e=o.expr||"smile";
 const arm=o.arm||"down",ah={out:[34,-70],up:[22,-108],down:[14,-40]}[arm],ap={out:"M6 -74 q16 0 28 4",up:"M6 -74 q12 -12 16 -34",down:"M6 -74 q10 16 8 34"}[arm];
