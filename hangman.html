<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTD's Hangman</title>
<style>
:root{--bg1:#140c2e;--bg2:#3a1066;--acc:#ffb800;--acc2:#ff3d7f;--ok:#2ee59d;--bad:#ff4d4d;--fg:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:radial-gradient(circle at 30% 10%,var(--bg2),var(--bg1) 70%);display:flex;flex-direction:column;align-items:center;min-height:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation}
header{text-align:center;padding:10px 8px 0}
h1{margin:0;font-size:clamp(22px,5vw,38px);letter-spacing:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;opacity:.75;letter-spacing:1px}
#stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.st{background:rgba(255,255,255,.08);border-radius:12px;padding:6px 12px;font-size:14px;text-align:center;min-width:70px}.st b{display:block;font-size:20px;color:var(--acc)}
main{width:100%;max-width:900px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:0 10px}
#stage{flex:1 1 260px;max-width:340px}svg{width:100%;height:auto;display:block}
.part{stroke:#fff;stroke-width:6;stroke-linecap:round;fill:none;opacity:0}
.part.on{opacity:1;animation:draw .5s ease-out forwards}
.gal{stroke:#c98b4a;stroke-width:8;stroke-linecap:round;fill:none}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.lost #fig{animation:sway 1.6s ease-in-out infinite;transform-origin:200px 40px}
@keyframes sway{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.won #fig .part{stroke:var(--ok)}
#right{flex:1 1 320px;display:flex;flex-direction:column;align-items:center;gap:10px}
#cat{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#1b0b33;font-weight:800;border-radius:99px;padding:6px 16px;font-size:15px}
#word{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 18px;min-height:60px}
.wd{display:flex;gap:5px}
.ch{width:clamp(22px,6vw,36px);height:clamp(34px,8vw,48px);border-bottom:4px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.5vw,32px);font-weight:800;text-transform:uppercase}
.ch.rev{animation:pop .35s}.ch.miss{color:var(--bad)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#lives{font-size:14px;opacity:.85}
#kb{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:100%;max-width:520px;margin:6px auto 14px;padding:0 6px}
#kb button{height:clamp(42px,10vw,54px);font-size:clamp(17px,4.5vw,22px);font-weight:800;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;transition:transform .1s,background .2s}
#kb button:active{transform:scale(.92)}#kb button:hover:not(:disabled){background:rgba(255,255,255,.26)}
#kb button.hit{background:var(--ok);color:#06331f}#kb button.no{background:rgba(255,77,77,.35);color:#ffbdbd}
#kb button:disabled{cursor:default}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,5,25,.75);backdrop-filter:blur(4px);z-index:5;padding:16px}
#ov.show{display:flex}
.card{background:linear-gradient(160deg,#2b1257,#170a33);border:2px solid rgba(255,255,255,.15);border-radius:20px;padding:24px;text-align:center;max-width:380px;width:100%;animation:pop .4s}
.card h2{margin:0 0 6px;font-size:34px}.card p{margin:6px 0;font-size:16px}
.ans{font-size:24px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:2px}
.btn{margin-top:14px;border:none;border-radius:99px;padding:14px 30px;font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#1b0b33;cursor:pointer}
#tools{display:flex;gap:8px}.sm{border:none;border-radius:99px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
footer{font-size:12px;opacity:.55;padding:0 0 12px;text-align:center}
#conf{position:fixed;inset:0;pointer-events:none;z-index:6}
</style></head><body>
<header><h1>HANGMAN</h1><div class="sub">with @TheCriticalDri1</div></header>
<div id="stats"><div class="st">Score<b id="sScore">0</b></div><div class="st">Streak<b id="sStreak">0</b></div><div class="st">Best<b id="sBest">0</b></div><div class="st">Won/Played<b id="sWP">0/0</b></div></div>

<g id="fig">

<line class="part" x1="200" y1="125" x2="160" y2="165"/>
<line class="part" x1="200" y1="125" x2="240" y2="165"/>
<line class="part" x1="200" y1="190" x2="168" y2="245"/>
<line class="part" x1="200" y1="190" x2="232" y2="245"/>
<path class="part" d="M188 70l8 8m0-8l-8 8M204 70l8 8m0-8l-8 8M188 94q12-8 24 0" style="stroke-width:3"/>
</g></svg></div>
<div id="right"><div id="cat">Category</div><div id="word"></div><div id="lives"></div>
<div id="tools"><button class="sm" id="hintBtn">💡 Hint (−5)</button><button class="sm" id="skipBtn">⏭ New word</button></div></div>
</main>
<div id="kb"></div>
<footer>Type on your keyboard or tap the letters · <span id="left"></span></footer>
<div id="ov"><div class="card"><h2 id="ovT"></h2><p id="ovM"></p><p class="ans" id="ovA"></p><p id="ovS"></p><button class="btn" id="next">NEXT WORD ▶</button></div></div>

const $=id=>document.getElementById(id);
let st;function load(){try{st=JSON.parse(localStorage.getItem(K))||null}catch(e){st=null}
 if(!st||!Array.isArray(st.deck)||st.n!==DATA.w.length)st={n:DATA.w.length,deck:[],pos:0,seed:0,score:0,streak:0,best:0,won:0,played:0,cur:null};}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function reshuffle(){const last=st.deck.length?st.deck[st.deck.length-1]:-1;st.seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;const r=rng(st.seed),d=[...Array(DATA.w.length).keys()];
 for(let i=d.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 if(d[0]===last&&d.length>1)[d[0],d[1]]=[d[1],d[0]];st.deck=d;st.pos=0;}
function draw(){if(st.pos>=st.deck.length)reshuffle();const i=st.deck[st.pos++];save();return i}
let word,cat,guessed,wrong,over,parts=[...document.querySelectorAll('.part')];
parts.forEach(p=>{const l=Math.ceil(p.getTotalLength?p.getTotalLength():300);p.style.strokeDasharray=l;p.style.setProperty('--len',l);p.style.strokeDashoffset=l});
const kb=$('kb');"QWERTYUIOPASDFGHJKLZXCVBNM".split('').forEach(c=>{const b=document.createElement('button');b.textContent=c;b.id='k'+c;b.onclick=()=>guess(c.toLowerCase());kb.appendChild(b)});
function newGame(resume){if(!(resume&&st.cur)){st.cur={i:draw(),g:[],h:0};save()}
 const e=DATA.w[st.cur.i];word=e[0];cat=DATA.c[e[1]];guessed=new Set();wrong=0;over=false;
 document.body.classList.remove('won','lost');parts.forEach(p=>p.classList.remove('on'));
 kb.querySelectorAll('button').forEach(b=>{b.disabled=false;b.className=''});
 $('cat').textContent='Category: '+cat;
 $('word').innerHTML=word.split(' ').map(w=>'<div class="wd">'+w.split('').map(c=>'<div class="ch" data-c="'+c+'"></div>').join('')+'</div>').join('');

 $('left').textContent=(st.deck.length-st.pos)+' of '+DATA.w.length+' unseen words left in this deck';}
function guess(c,silent){if(over||guessed.has(c)||!/^[a-z]$/.test(c))return;guessed.add(c);if(!silent){st.cur.g.push(c);save()}
 const b=$('k'+c.toUpperCase());b.disabled=true;
 if(word.includes(c)){b.className='hit';document.querySelectorAll('.ch[data-c="'+c+'"]').forEach(x=>{x.textContent=c;x.classList.add('rev')});if(!silent)beep(660,.08)}
 else{b.className='no';parts[wrong].classList.add('on');wrong++;if(!silent){beep(160,.15);$('word').classList.remove('shake');void $('word').offsetWidth;$('word').classList.add('shake')}}
 upd();check(silent);}
function solved(){return word.split('').every(c=>c===' '||guessed.has(c))}
function check(){if(solved())end(true);else if(wrong>=MAXW)end(false)}
function end(win){over=true;st.played++;let pts=0;
 if(win){st.won++;st.streak++;pts=10*new Set(word.replace(/ /g,'')).size+(MAXW-wrong)*5+st.streak*2;pts=Math.max(5,pts);st.score+=pts;st.best=Math.max(st.best,st.streak);document.body.classList.add('won');confetti()}
 else{st.streak=0;document.body.classList.add('lost');document.querySelectorAll('.ch').forEach(x=>{if(!x.textContent){x.textContent=x.dataset.c;x.classList.add('miss')}})}

$('next').onclick=()=>newGame();
$('skipBtn').onclick=()=>{if(!over&&st.cur&&st.cur.g.length){st.streak=0;st.played++;}st.cur=null;save();newGame()};
$('hintBtn').onclick=()=>{if(over)return;const left=[...new Set(word.replace(/ /g,''))].filter(c=>!guessed.has(c));if(left.length<2)return;st.cur.h=(st.cur.h||0)+1;st.score=Math.max(0,st.score-5);upd();guess(left[Math.floor(Math.random()*left.length)])};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if($('ov').classList.contains('show')){if(e.key==='Enter'||e.key===' '){e.preventDefault();newGame()}return}const k=e.key.toLowerCase();if(/^[a-z]$/.test(k))guess(k)});
let ac;function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let confId=0;function confetti(){const my=++confId;const cv=$('conf'),x=cv.getContext&&cv.getContext('2d');if(!x)return;cv.width=innerWidth;cv.height=innerHeight;const P=[...Array(120)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,v:2+Math.random()*4,r:Math.random()*6.3,c:['#ffb800','#ff3d7f','#2ee59d','#5ab8ff','#fff'][Math.floor(Math.random()*5)]}));let t=0;
 (function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.r)*10,p.y);x.rotate(p.r);x.fillRect(-4,-6,8,12);x.restore()});if(my===confId&&++t<180)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();}
