<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>CTD's Sky Drop</title>
<style>
:root {
  --bg: #101318;
  --text: #f3f5f8;
  --muted: #a8b0bd;
  --on: #ffffff;
  --accent: #3c82f6;
  --secondary: #3b4a5c;
  --chute: #e8322b;
  --radius-lg: 16px;
  --radius-md: 12px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
#shell {
  position: fixed;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  touch-action: none;
  overscroll-behavior: none;
}
#app {
  display: flex;
  flex-direction: column;
  align-items: center;
  box-sizing: border-box;
  max-width: 480px;
  touch-action: none;
  overscroll-behavior: none;
}
#wrap {
  position: relative;
  touch-action: none;
  flex: 0 0 auto;
}
canvas {
  display: block;
  border-radius: var(--radius-md);
  touch-action: none;
  background: #7ec8f0;
}
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(0, 0, 0, .55);
  color: #fff;
  text-align: center;
  padding: 16px;
  box-sizing: border-box;
  border-radius: var(--radius-md);
  touch-action: none;
}
#overlay h1 {
  font-size: 34px;
  font-weight: 800;
  margin: 0;
  line-height: 1.1;
}
#blurb { font-size: 16px; max-width: 320px; line-height: 1.35; }
#scoreline { font-size: 18px; }
#scoreline b { font-size: 30px; }
#jumps { font-size: 14px; margin-top: 6px; }
#newhs { margin-top: 6px; }
#hsline { font-size: 16px; }
#play {
  flex: none;
  width: 220px;
  height: 72px;
  margin-top: 4px;
  font-size: 26px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-lg);
  background: var(--accent);
  color: var(--on);
  touch-action: none;
  cursor: pointer;
}
#controls {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  touch-action: none;
}
#controls button {
  flex: 1 1 0;
  height: 72px;
  font-size: 26px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-lg);
  background: var(--secondary);
  color: var(--on);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  padding: 0 4px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#bChute {
  flex: 1.4 1 0;
  background: var(--chute);
  font-size: clamp(14px, 4.8vw, 26px);
  white-space: nowrap;
}
#hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  text-align: center;
  line-height: 1.35;
  padding-bottom: calc(6px + env(safe-area-inset-bottom));
}
#mute {
  position: absolute;
  right: 8px;
  bottom: 8px;
  z-index: 5;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.75);
  background: rgba(16,19,24,.55);
  color: #fff;
  font-size: 18px;
  line-height: 1;
  padding: 0;
  touch-action: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#shopBtn{flex:none;width:220px;height:60px;font-size:22px;font-weight:700;border:none;border-radius:var(--radius-lg);background:#b8860b;color:#fff;cursor:pointer;touch-action:manipulation}
#coinline{font-size:16px;margin-top:6px}
#shop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;background:rgba(0,0,0,.55);color:#fff;padding:16px;box-sizing:border-box;border-radius:var(--radius-md);overflow-y:auto;touch-action:pan-y}
#shop h2{font-size:26px;font-weight:800;margin:0}
.upg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;max-width:420px;background:rgba(255,255,255,.1);border-radius:var(--radius-md);padding:8px;box-sizing:border-box;text-align:left}
.upg .nm{flex:1 1 150px;min-width:0}.upg .t{font-size:16px;font-weight:700}.upg .lv{font-size:13px;opacity:.8}.upg .d{font-size:12px;opacity:.85}
.upg button{height:48px;min-width:110px;font-size:16px;font-weight:700;border:none;border-radius:var(--radius-lg);background:#e0a800;color:#222;cursor:pointer;touch-action:manipulation}
.upg button:disabled{background:#666;color:#bbb;opacity:.7;cursor:default}
#shopBack{flex:none;width:200px;height:56px;margin-top:4px;font-size:24px;font-weight:700;border:none;border-radius:var(--radius-lg);background:var(--secondary);color:#fff;cursor:pointer}
#mute[aria-pressed="true"] { opacity: .7; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="shell">
  <div id="app">
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="overlay">
        <h1>🪂 CTD's Sky Drop</h1>
        <div id="blurb">Jump, steer through the wind, pop the chute in time and land on the bullseye. 5 jumps. Too fast = splat! Grab coins, ride updrafts, dodge birds.</div>
        <div id="scoreline" class="hidden"></div>
        <div id="jumps" class="hidden"></div>
        <div id="coinline" class="hidden"></div>
        <div id="newhs" class="hidden"></div>
        <div id="hsline" class="hidden"></div>
        <button id="play" type="button">PLAY</button>
        <button id="shopBtn" type="button">SHOP · 0 coins</button>
      </div>
      <div id="shop" class="hidden"><h2>Upgrade Shop</h2><div id="bankline">Bank: <b>0</b> coins</div><div id="upgs" style="display:contents"></div><button id="shopBack" type="button">BACK</button></div>
      <button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
    </div>
    <div id="controls">
      <button id="bL" type="button">◀</button>
      <button id="bChute" type="button">CHUTE / JUMP</button>
      <button id="bR" type="button">▶</button>
    </div>
    <div id="hint">Hold ◀ ▶ to steer · CHUTE to jump / open · Keys: ←/→ or A/D, Space/↑, Enter to start</div>
  </div>
</div>
<script>
"use strict";
const W = 800, VH = 1060, GROUND = 3000, ROUNDS = 5, HS_KEY = "ctdSkyDropHS";
let memHs = 0;
function loadHs() {
  try {
    const v = Number(window.localStorage.getItem(HS_KEY));
    return isFinite(v) && v > 0 ? v : memHs;
  } catch (e) { return memHs; }
}
function saveHs(v) {
  memHs = v;
  try { window.localStorage.setItem(HS_KEY, String(v)); } catch (e) { /* ignore */ }
}

const BANK_KEY = "ctdSkyDropCoins", UPG_KEY = "ctdSkyDropUpg";
let memBank = 0, memUpg = { chute: 0, steer: 0, magnet: 0, shield: 0 };
function loadBank() { try { const v = Number(window.localStorage.getItem(BANK_KEY)); return isFinite(v) && v > 0 ? v : memBank; } catch (e) { return memBank; } }
function saveBank(v) { memBank = v; try { window.localStorage.setItem(BANK_KEY, String(v)); } catch (e) { /* ignore */ } }
function loadUpg() {
  try {
    const raw = window.localStorage.getItem(UPG_KEY);
    if (!raw) return Object.assign({}, memUpg);
    const o = JSON.parse(raw) || {};
    const c = function (n) { const v = Number(n); return isFinite(v) ? Math.max(0, Math.min(3, Math.floor(v))) : 0; };
    return { chute: c(o.chute), steer: c(o.steer), magnet: c(o.magnet), shield: c(o.shield) };
  } catch (e) { return Object.assign({}, memUpg); }
}
function saveUpg(u) { memUpg = Object.assign({}, u); try { window.localStorage.setItem(UPG_KEY, JSON.stringify(u)); } catch (e) { /* ignore */ } }
const UPGS = [
  { k: "chute", name: "Bigger Chute", desc: "Softer canopy descent", prices: [20, 50, 100] },
  { k: "steer", name: "Better Steering", desc: "More air control", prices: [20, 50, 100] },
  { k: "magnet", name: "Coin Magnet", desc: "Bigger coin pickup radius", prices: [15, 40, 80] },
  { k: "shield", name: "Bird Shield", desc: "+1 free bird hit per jump", prices: [25, 60, 120] }
];
let bank = loadBank(), upg = loadUpg(), runCoins = 0, shopOpen = false;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let scale = 1;

function viewBox() {
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) {
    return { w: vv.width, h: vv.height, x: vv.offsetLeft || 0, y: vv.offsetTop || 0 };
  }
  return { w: window.innerWidth, h: window.innerHeight, x: 0, y: 0 };
}

function layout() {
  const v = viewBox();
  const shell = document.getElementById("shell");
  shell.style.left = v.x + "px";
  shell.style.top = v.y + "px";
  shell.style.width = v.w + "px";
  shell.style.height = v.h + "px";
  const maxW = Math.max(200, Math.min(480, v.w));
  const app = document.getElementById("app");
  const controls = document.getElementById("controls");
  const hint = document.getElementById("hint");
  const wrap = document.getElementById("wrap");
  app.style.width = maxW + "px";
  let cw = maxW;
  let ch = cw * VH / W;
  for (let pass = 0; pass < 2; pass++) {
    controls.style.width = cw + "px";
    hint.style.width = cw + "px";
    const chrome = 8 + controls.offsetHeight + 6 + hint.offsetHeight;
    const availH = Math.max(140, v.h - chrome);
    cw = maxW;
    ch = cw * VH / W;
    if (ch > availH) {
      ch = availH;
      cw = ch * W / VH;
    }
  }
  controls.style.width = cw + "px";
  hint.style.width = cw + "px";
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(cw * dpr));
  scale = cv.width / W;
  cv.height = Math.max(1, Math.round(scale * VH));
  const cssW = cv.width / dpr;
  const cssH = cv.height / dpr;
  cv.style.width = cssW + "px";
  cv.style.height = cssH + "px";
  wrap.style.width = cssW + "px";
  wrap.style.height = cssH + "px";
}

let ac = null, master = null, wind = null, audioPrimed = false, muted = false, pageHidden = false;
function setPlaybackSession() {
  try {
    if (navigator.audioSession && typeof navigator.audioSession.type !== "undefined") navigator.audioSession.type = "playback";
  } catch (e) { /* older browsers */ }
}
function AC() {
  setPlaybackSession();
  try {
    if (!ac) {
      const K = window.AudioContext || window.webkitAudioContext;
      if (K) ac = new K();
    }
    if (ac && ac.state === "suspended") ac.resume().catch(function () {});
  } catch (e) { ac = null; }
  return ac;
}
function ensureGraph() {
  if (!ac || master) return;
  master = ac.createGain();
  master.gain.value = muted ? 0 : 1;
  master.connect(ac.destination);
}
function playSilentBuffer() {
  const a = AC();
  if (!a) return;
  try {
    const n = Math.max(1, Math.floor(a.sampleRate * 0.05));
    const buf = a.createBuffer(1, n, a.sampleRate);
    const src = a.createBufferSource();
    src.buffer = buf;
    src.connect(a.destination);
    src.start(0);
  } catch (e) { /* silent */ }
}
function ensureWind() {
  if (wind || !ac) return;
  try {
    ensureGraph();
    const n = Math.max(1, Math.floor(ac.sampleRate * 2));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 180;
    bp.Q.value = 0.55;
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 420;
    lp.Q.value = 0.7;
    const g = ac.createGain();
    g.gain.value = 0;
    src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
    src.start(0);
    wind = { bp: bp, lp: lp, g: g };
  } catch (e) { wind = null; }
}
function primeAudio() {
  setPlaybackSession();
  const a = AC();
  if (!a) return;
  ensureGraph();
  try { if (a.state === "suspended") a.resume().catch(function () {}); } catch (e) { /* ignore */ }
  if (!audioPrimed) {
    playSilentBuffer();
    audioPrimed = true;
    ensureWind();
  }
}
function resumeAudio() {
  setPlaybackSession();
  if (!ac) return;
  try { if (ac.state === "suspended") ac.resume().catch(function () {}); } catch (e) { /* ignore */ }
}
function renderMute() {
  const b = document.getElementById("mute");
  b.setAttribute("aria-pressed", muted ? "true" : "false");
  b.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  b.textContent = muted ? "🔇" : "🔊";
}
function setMuted(on) {
  muted = !!on;
  if (ac) {
    const now = ac.currentTime;
    if (master) { try { master.gain.setValueAtTime(muted ? 0 : 1, now); } catch (e) { master.gain.value = muted ? 0 : 1; } }
    if (muted && wind) { try { wind.g.gain.setValueAtTime(0, now); } catch (e) { wind.g.gain.value = 0; } }
  }
  renderMute();
}
function lerp(a, b, t) { return a + (b - a) * t; }
function updateWind(dt) {
  if (!wind || !ac) {
    if (audioPrimed && ac && ac.state === "running") ensureWind();
    return;
  }
  let vol = 0, bpF = 180, lpF = 400;
  const falling = !pageHidden && !muted && state === "play" && R && R.phase === "fall";
  if (falling) {
    const t = Math.max(0, Math.min(1, R.p.vy / 260));
    const mix = R.p.chute ? Math.min(1, 0.75 + 0.25 * (R.p.open || 0)) : 0;
    vol = lerp(0.01 + 0.05 * t, 0.004 + 0.01 * t, mix);
    bpF = lerp(160 + 320 * t, 120 + 80 * t, mix);
    lpF = lerp(380 + 520 * t, 260 + 140 * t, mix);
  }
  const tau = vol >= wind.g.gain.value ? 0.18 : 0.3;
  const k = 1 - Math.exp(-Math.max(0.001, dt) / tau);
  const now = ac.currentTime;
  function glide(param, target) {
    param.setValueAtTime(param.value + (target - param.value) * k, now);
  }
  try {
    glide(wind.g.gain, vol);
    glide(wind.bp.frequency, bpF);
    glide(wind.lp.frequency, lpF);
  } catch (e) { /* ignore */ }
}
function tone(f, d, type, v, f2) {
  try {
    if (muted) return;
    const a = ac;
    if (!a) return;
    ensureGraph();
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, a.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + d);
    g.gain.setValueAtTime(v == null ? 0.2 : v, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
    o.connect(g); g.connect(master);
    o.start(); o.stop(a.currentTime + d);
  } catch (e) { /* silent */ }
}
function noise(d, v, fc) {
  try {
    if (muted) return;
    const a = ac;
    if (!a) return;
    ensureGraph();
    const b = a.createBuffer(1, Math.floor(a.sampleRate * d), a.sampleRate);
    const ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = a.createBufferSource();
    s.buffer = b;
    const f = a.createBiquadFilter();
    f.frequency.value = fc == null ? 800 : fc;
    const g = a.createGain();
    g.gain.value = v == null ? 0.3 : v;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  } catch (e) { /* silent */ }
}
function later(fn, ms) { window.setTimeout(fn, ms); }
const sfx = {
  jump: function () { tone(500, 0.4, "triangle", 0.2, 180); },
  chute: function () { noise(0.35, 0.4, 1500); tone(220, 0.25, "square", 0.08, 440); },
  land: function () { tone(523, 0.12, "triangle", 0.25); later(function () { tone(659, 0.12, "triangle", 0.25); }, 110); later(function () { tone(784, 0.25, "triangle", 0.25); }, 220); },
  bull: function () { [523, 659, 784, 1047].forEach(function (f, i) { later(function () { tone(f, 0.18, "square", 0.12); }, i * 90); }); },
  crash: function () { noise(0.6, 0.6, 400); tone(300, 0.7, "sawtooth", 0.15, 60); later(function () { tone(900, 0.15, "sine", 0.15, 1400); }, 500); },
  miss: function () { tone(300, 0.25, "triangle", 0.2, 200); later(function () { tone(200, 0.4, "triangle", 0.2, 120); }, 220); },
  squawk: function () { tone(1300, 0.12, "sawtooth", 0.1, 650); later(function () { tone(1100, 0.14, "sawtooth", 0.09, 500); }, 110); },
  coin: function () { tone(1320, 0.07, "square", 0.07); later(function () { tone(1980, 0.16, "square", 0.07); }, 60); },
  shield: function () { tone(600, 0.2, "sine", 0.15, 1200); },
  buy: function () { tone(880, 0.08, "square", 0.08); later(function () { tone(1320, 0.18, "square", 0.08); }, 80); }
};

let state = "menu", round = 0, total = 0, results = [], hs = loadHs();
const keys = {};
let touchDir = 0;
const clouds = Array.from({ length: 18 }, function () {
  return { x: Math.random() * 1200 - 200, y: Math.random() * (GROUND - 700) + 100, s: 0.6 + Math.random() * 1.2, v: 0.2 + Math.random() * 0.5 };
});
const cacti = Array.from({ length: 9 }, function (_, i) {
  return { x: 40 + i * 90 + Math.random() * 40, h: 20 + Math.random() * 25 };
});
function rings() {
  const k = 1 - 0.1 * round;
  return [{ r: 28 * k, p: 100, c: "#e8322b" }, { r: 60 * k, p: 50, c: "#fff" }, { r: 100 * k, p: 25, c: "#e8322b" }, { r: 145 * k, p: 10, c: "#fff" }];
}
function mkRound() {
  const wind = (Math.random() < 0.5 ? -1 : 1) * (15 + round * 14 + Math.random() * 12);
  const r = {
    p: { x: 120 + Math.random() * 80, y: 120, vx: 90, vy: 0, chute: false, open: 0, tilt: 0 },
    planeX: 0, wind: wind, gust: 0,
    tx: 250 + Math.random() * 300,
    tdir: round >= 3 ? (Math.random() < 0.5 ? -1 : 1) * (25 + (round - 3) * 25) : 0,
    phase: "plane", t: 0, done: null, cam: 0, parts: [],
    birds: [], drafts: [], coins: [], got: 0, hits: 0, tumble: 0, hitCd: 0, liftT: 0, salX: 0, shield: 0
  };
  if (wind < 0) r.p.x += 200;
  r.planeX = r.p.x - 40;
  return r;
}
function populate(r) {
  r.salX = r.tx < 400 ? 695 : 105;
  const nb = 2 + round, bs = 70 + round * 18;
  for (let i = 0; i < nb; i++) { const d = Math.random() < 0.5 ? -1 : 1; r.birds.push({ x: Math.random() * W, y: 500 + (i + Math.random() * 0.8) * ((GROUND - 1000) / nb), vx: d * (bs + Math.random() * 40), ph: Math.random() * 6 }); }
  const nd = 2 + (round % 2);
  for (let i = 0; i < nd; i++) { const top = 450 + Math.random() * 900; r.drafts.push({ x: 110 + Math.random() * 580, w: 80 + Math.random() * 40, top: top, bot: Math.min(GROUND - 450, top + 700 + Math.random() * 500) }); }
  for (let i = 0; i < 6; i++) r.coins.push({ x: 60 + Math.random() * (W - 120), y: 400 + Math.random() * (GROUND - 900), got: false, ph: Math.random() * 6 });
  r.drafts.forEach(function (d) { for (let j = 0; j < 2; j++) r.coins.push({ x: d.x + (Math.random() - 0.5) * d.w * 0.5, y: d.top + 80 + Math.random() * (d.bot - d.top - 160), got: false, ph: Math.random() * 6 }); });
  r.birds.forEach(function (b) { if (Math.random() < 0.7) r.coins.push({ x: 60 + Math.random() * (W - 120), y: b.y + (Math.random() - 0.5) * 30, got: false, ph: Math.random() * 6 }); });
}
function newRound() { const r = mkRound(); populate(r); r.shield = upg.shield; return r; }
let R = mkRound();
R.tx = 400;
populate(R);

function jump() { if (R.phase === "plane") { R.phase = "fall"; sfx.jump(); } }
function chute() {
  AC();
  if (state !== "play") return;
  if (R.phase === "plane") { jump(); return; }
  if (R.phase === "fall" && !R.p.chute) { R.p.chute = true; sfx.chute(); }
}
function setDir(d) {
  touchDir = d;
  if (d !== 0 && state === "play" && R.phase === "plane") jump();
}
let newHsFlag = false;
function renderUi() {
  const over = state === "over";
  document.getElementById("overlay").classList.toggle("hidden", state === "play" || shopOpen);
  document.getElementById("shop").classList.toggle("hidden", state === "play" || !shopOpen);
  document.getElementById("shopBtn").textContent = "SHOP · " + bank + " coins";
  const cl = document.getElementById("coinline");
  cl.classList.toggle("hidden", !over);
  cl.innerHTML = "🪙 Coins this run: <b>" + runCoins + "</b> · Bank: <b>" + bank + "</b>";
  renderShop();
  document.getElementById("blurb").classList.toggle("hidden", over);
  document.getElementById("scoreline").classList.toggle("hidden", !over);
  document.getElementById("jumps").classList.toggle("hidden", !over);
  document.getElementById("play").textContent = state === "menu" ? "PLAY" : "PLAY AGAIN";

    gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.2, "rgba(255,255,255,.13)"); gr.addColorStop(0.8, "rgba(255,255,255,.13)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gr; ctx.fillRect(d.x - d.w / 2, d.top, d.w, d.bot - d.top);
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      for (let yy = d.top + 40; yy < d.bot - 40; yy += 16) { const xx = d.x + k * d.w * 0.28 + Math.sin(yy * 0.03 + now * 4 + k) * 5; if (yy === d.top + 40) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy); }
      ctx.stroke();
    }
    for (let k = 0; k < 4; k++) { const yy = d.bot - ((now * 120 + k * (d.bot - d.top) / 4) % (d.bot - d.top)); ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.moveTo(d.x, yy - 10); ctx.lineTo(d.x - 8, yy); ctx.lineTo(d.x + 8, yy); ctx.fill(); }
  });
  R.coins.forEach(function (c) {
    if (c.got) return;
    const s = Math.abs(Math.cos(now * 3 + c.ph));
    ctx.fillStyle = "#e0a800"; ctx.beginPath(); ctx.ellipse(c.x, c.y, 13 * s + 2, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.ellipse(c.x, c.y, 9 * s + 1, 9, 0, 0, 7); ctx.fill();
  });
  R.birds.forEach(function (b) {
    const f = Math.sin(b.ph) * 9, d = b.vx > 0 ? 1 : -1;
    ctx.strokeStyle = "#222"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x - 18, b.y - f); ctx.quadraticCurveTo(b.x - 8, b.y - 6 - f * 0.4, b.x, b.y); ctx.quadraticCurveTo(b.x + 8, b.y - 6 - f * 0.4, b.x + 18, b.y - f); ctx.stroke();
    ctx.fillStyle = "#333"; ctx.beginPath(); ctx.ellipse(b.x, b.y + 2, 7, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#f0a020"; ctx.beginPath(); ctx.moveTo(b.x + d * 7, b.y); ctx.lineTo(b.x + d * 13, b.y + 2); ctx.lineTo(b.x + d * 7, b.y + 4); ctx.fill();
  });
  if (R.phase === "fall") R.parts.forEach(function (q) { ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, 4, 4); });
}
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const k = state === "play" ? R.cam / GROUND : 0;
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, "hsl(205,70%," + (45 + k * 15) + "%)");
  g.addColorStop(1, "hsl(195,80%," + (75 + k * 10) + "%)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, VH);
  const cam = state === "play" ? R.cam : GROUND - VH + 80;
  ctx.save();
  ctx.translate(0, -cam);
  clouds.forEach(function (c) {
    c.x += c.v * (state === "play" ? R.wind / 20 : 1);
    if (c.x > W + 100) c.x = -160;
    if (c.x < -180) c.x = W + 80;
    drawCloud(c.x, c.y, c.s);
  });
  if (state === "play") drawAir();
  drawGround();
  if (state === "play") {
    if (R.planeX < W + 150) drawPlane(R.planeX, 110);
    if (R.phase !== "plane") drawJumper(R.p, R.phase === "landed");
    if (R.phase === "fall" && R.shield > 0) { ctx.strokeStyle = "rgba(120,220,255,.7)"; ctx.lineWidth = 2 + R.shield; ctx.beginPath(); ctx.arc(R.p.x, R.p.y - 12, 34, 0, 7); ctx.stroke(); }
  }
  ctx.restore();
  if (state === "play") hud();
}

function onKeyDown(e) {
  keys[e.code] = true;
  primeAudio();
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "ArrowLeft" || e.code === "ArrowRight") e.preventDefault();
  if (e.code === "Space" || e.code === "ArrowUp") chute();
  if (e.code === "Enter" && state !== "play" && !shopOpen) start();
}
function onKeyUp(e) { keys[e.code] = false; }
window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);
document.addEventListener("touchmove", function (e) { if (!(shopOpen && e.target.closest && e.target.closest("#shop"))) e.preventDefault(); }, { passive: false });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
document.getElementById("wrap").addEventListener("contextmenu", function (e) { e.preventDefault(); });

function hold(id, d) {
  const b = document.getElementById(id);
  const down = function (e) { e.preventDefault(); primeAudio(); setDir(d); };
  const up = function (e) { e.preventDefault(); setDir(0); };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointerleave", up);
  b.addEventListener("pointercancel", up);
}
hold("bL", -1);
hold("bR", 1);
document.getElementById("bChute").addEventListener("pointerdown", function (e) { e.preventDefault(); primeAudio(); chute(); });
document.getElementById("shopBtn").addEventListener("click", function (e) { e.preventDefault(); primeAudio(); setShop(true); });
document.getElementById("shopBack").addEventListener("click", function (e) { e.preventDefault(); primeAudio(); setShop(false); });
document.getElementById("play").addEventListener("pointerdown", function (e) { e.preventDefault(); primeAudio(); start(); });
["play", "bL", "bR", "bChute", "shopBtn", "shopBack"].forEach(function (id) {
  const el = document.getElementById(id);
  ["pointerup", "touchend", "click"].forEach(function (type) {
    el.addEventListener(type, function () { primeAudio(); }, type === "touchend" ? { passive: true } : false);
  });
});
function onGesture(e) { primeAudio(); }
document.addEventListener("pointerup", onGesture);
document.addEventListener("click", onGesture);
document.addEventListener("touchend", onGesture, { passive: true });
const muteBtn = document.getElementById("mute");
["pointerup", "touchend", "click"].forEach(function (type) {
  muteBtn.addEventListener(type, function () { primeAudio(); }, type === "touchend" ? { passive: true } : false);
});
muteBtn.addEventListener("pointerup", function (e) {
  e.preventDefault();
  e.stopPropagation();
  primeAudio();
  setMuted(!muted);
});
document.addEventListener("visibilitychange", function () {
  pageHidden = document.visibilityState === "hidden";
  if (!pageHidden) resumeAudio();
});

window.addEventListener("resize", layout);
window.addEventListener("orientationchange", layout);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", layout);
  window.visualViewport.addEventListener("scroll", layout);
}
layout();
renderUi();

let last = performance.now();
function loop(n) {
  const dt = Math.min(0.05, Math.max(0, (n - last) / 1000));
  last = n;
  update(dt);
  updateWind(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__game = {
  W: W, VH: VH, GROUND: GROUND,
  get state() { return state; },
  get round() { return round; },
  get total() { return total; },
  get R() { return R; },
  get scale() { return scale; },
  get bank() { return bank; }, get upg() { return upg; }, get runCoins() { return runCoins; },
  buy: buy, setShop: setShop,
  start: start, chute: chute, setDir: setDir, layout: layout,
  get muted() { return muted; },
  get audioPrimed() { return audioPrimed; },
  get audioState() { return ac ? ac.state : "none"; },
  get windGain() { return wind ? wind.g.gain.value : 0; },
  get windLp() { return wind ? wind.lp.frequency.value : 0; },
  get windBp() { return wind ? wind.bp.frequency.value : 0; }
};
</script>
